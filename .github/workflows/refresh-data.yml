name: Refresh game data

# Downloads the current Global master.mdb, and when the game's resource version
# changed, regenerates public/data/game-data.json. Also refreshes the Champions
# Meeting schedule and course layouts from GameTora (public/data/race-extras.json)
# and downloads portraits for cards that don't have one yet (public/img/cards).
# Commits and redeploys when anything changed.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the resource version is unchanged
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/ingest/requirements.txt

      - name: Download master.mdb
        id: fetch
        run: |
          python scripts/ingest/fetch_master.py "$RUNNER_TEMP/master.mdb" > "$RUNNER_TEMP/fetch.json"
          cat "$RUNNER_TEMP/fetch.json"
          echo "version=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["resource_version"])' "$RUNNER_TEMP/fetch.json")" >> "$GITHUB_OUTPUT"
          echo "app=$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("app_version") or "")' "$RUNNER_TEMP/fetch.json")" >> "$GITHUB_OUTPUT"
          echo "current=$(python -c 'import json; print(json.load(open("public/data/game-data.json"))["meta"].get("resourceVersion",""))')" >> "$GITHUB_OUTPUT"

      - name: Build game data
        if: steps.fetch.outputs.version != steps.fetch.outputs.current || inputs.force
        run: |
          python scripts/ingest/build_data.py "$RUNNER_TEMP/master.mdb" public/data/game-data.json \
            --resource-version "${{ steps.fetch.outputs.version }}" --app-version "${{ steps.fetch.outputs.app }}"

      - name: Refresh race details (GameTora)
        # A GameTora outage must not block game-data updates; the previous file is kept.
        continue-on-error: true
        run: |
          python scripts/ingest/fetch_gametora.py "$RUNNER_TEMP/race-extras.json"
          # Only replace the committed file when the content (not just the fetch time) changed.
          if python - "$RUNNER_TEMP/race-extras.json" public/data/race-extras.json <<'PY'
          import json, sys
          a, b = (json.load(open(p)) for p in sys.argv[1:3])
          for d in (a, b):
              d["meta"].pop("fetchedAt", None)
          sys.exit(0 if a == b else 1)
          PY
          then echo "Race details unchanged."
          else cp "$RUNNER_TEMP/race-extras.json" public/data/race-extras.json
          fi

      - name: Portraits and CM banners
        # Only images without a file in public/img are downloaded (1 request/s).
        continue-on-error: true
        run: python scripts/ingest/fetch_images.py public/data/game-data.json public/data/race-extras.json public/img

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Test against the new data
        run: npm ci && npm test

      - name: Commit
        id: commit
        run: |
          if git diff --quiet -- public/data && [ -z "$(git status --porcelain -- public/img)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Game data unchanged (resource ${{ steps.fetch.outputs.version }})."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data public/img
            git commit -m "data: refresh (game resource ${{ steps.fetch.outputs.version }})"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy explicitly.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
